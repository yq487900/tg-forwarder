# 本地从源码构建（开发 / 发布前验证用，不依赖 Docker Hub）
#
#   docker compose -f docker-compose.build.yml up -d --build
#   或者直接跑：bash build_local.sh
#
# 刻意和正式部署错开，两个可以同时跑、互不影响：
#   正式部署  容器 tg-forwarder        :9020   数据 ./data
#   本地构建  容器 tg-forwarder-local  :9025   数据 ./data-local
services:
  tg-forwarder:
    build:
      context: .
      # network: host —— 宿主机若用了旁路由/Clash 这类 fake-ip DNS，
      # 默认 bridge 网络里 pip 会因为域名解析成假 IP 而失败。
      network: host
      args:
        # 国内网络慢时在 .env 里写：PIP_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX: ${PIP_INDEX:-}
    image: tg-forwarder:local
    container_name: tg-forwarder-local
    restart: unless-stopped
    ports:
      - "9025:9020"
    environment:
      - TZ=Asia/Shanghai
      - PORT=9020
      - WEB_PASSWORD=${WEB_PASSWORD:-tgforward}
      - SECRET_KEY=${SECRET_KEY:-change-me-please}
      - RESET_SCRIPT=${RESET_SCRIPT:-./reset_panel_password.sh}
    volumes:
      # 独立数据目录：测试用的会话/配置放这里，绝不碰正式部署的 ./data
      - ./data-local:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
