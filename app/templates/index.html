<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TG 频道转发</title>
<style>
  :root{--bg:#0f1720;--card:#18232e;--line:#26384a;--fg:#e8eef5;--dim:#93a6b8;--acc:#2da7ea;--ok:#31c48d;--err:#f0616d;--warn:#e3a008}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:18px 14px 60px}
  h1{font-size:19px;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--dim);font-weight:600}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
  input[type=text],input[type=password],select,textarea{width:100%;background:#0d151d;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 10px;font-size:14px}
  textarea{min-height:58px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1 1 200px}
  button{background:var(--acc);color:#04121b;border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:500}
  button.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:var(--ok)}
  .pill.err{color:var(--err);border-color:var(--err)}
  .rule{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#131d27}
  .rule .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .rule .name{font-weight:600}
  .switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--acc);font-size:13px}
  #logs{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--dim);max-height:280px;overflow:auto}
  .pv{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:12.3px;color:var(--dim);margin-top:8px;padding:0 2px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#0b141c;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
  .hint{font-size:12px;color:var(--dim);margin-top:4px}
  a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛰️ TG 频道转发 <span id="tgstate" class="pill">读取中…</span></h1>

  <div class="card">
    <h2>① Telegram 登录（只需一次）</h2>
    <div id="loginBox"></div>
  </div>

  <div class="card">
    <h2>② 转发规则（可随意增删）</h2>
    <div id="rules"></div>
    <div class="bar">
      <button class="ghost" onclick="addRule()">＋ 新增规则</button>
      <button onclick="saveRules()" id="saveBtn">💾 保存并生效</button>
      <span class="hint">保存后立即生效，不用重启</span>
    </div>
  </div>

  <div class="card">
    <h2>③ 最近记录
      <span id="logState" class="hint" style="font-weight:400;margin-left:6px">连接中…</span>
      <button id="logRefresh" class="ghost" style="float:right;padding:3px 10px;font-size:12px;display:none;margin-left:6px" onclick="loadLogs(true)">刷新</button>
      <button class="ghost" style="float:right;padding:3px 10px;font-size:12px" onclick="clearLogs()">清空记录</button>
    </h2>
    <div id="logs">—</div>
    <div class="bar">
      <span class="hint">记录最多保留</span>
      <select id="logKeep" onchange="setLogKeep(this.value)" style="width:auto;padding:5px 8px;font-size:13px">
        <option value="200">200 条</option>
        <option value="500">500 条（默认）</option>
        <option value="1000">1000 条</option>
        <option value="3000">3000 条</option>
        <option value="0">不限（不自动清理）</option>
      </select>
      <span class="hint">超过上限时自动只保留最新的这些条，不用你手动清</span>
    </div>
  </div>

  <div class="card" id="panelSet">
    <h2>④ 面板设置（密码 / 恢复码 / 退出）</h2>
    <label>当前密码</label>
    <input type="password" id="curPw" placeholder="现在的面板密码">
    <div class="row">
      <div><label>新密码（至少 6 位）</label><input type="password" id="newPw"></div>
      <div><label>再输一次新密码</label><input type="password" id="newPw2"></div>
    </div>
    <div class="bar">
      <button onclick="savePanelPassword()" id="pwBtn">修改面板密码</button>
      <span class="hint">改完立即生效；其它设备/浏览器需要用新密码重新登录。修改时会同时生成新的恢复码。</span>
    </div>
    <div id="setMsg" class="hint"></div>

    <div id="codeBox" style="display:none">
      <label>你的恢复码（只显示这一次，请抄下来存好）</label>
      <div class="row" style="align-items:center">
        <div><input type="text" id="codeVal" readonly onclick="this.select()"></div>
        <div style="flex:0 0 auto"><button class="ghost" onclick="copyCode()">复制</button></div>
      </div>
      <div class="hint">忘记面板密码时，在登录页点「忘记密码？」，输入这个恢复码即可重设密码。</div>
    </div>

    <details>
      <summary>恢复码状态 / 重新生成</summary>
      <div id="recState" class="hint">读取中…</div>
      <div class="bar">
        <button class="ghost" onclick="regenRecovery()">重新生成恢复码</button>
        <span class="hint">需要填上面的「当前密码」；旧的恢复码会立即作废。</span>
      </div>
    </details>

    <div class="bar" style="border-top:1px solid var(--line);padding-top:12px;margin-top:14px">
      <button class="danger" onclick="panelLogout()">退出面板登录</button>
      <span class="hint">只是退出这个网页面板，不影响 Telegram 登录和转发规则。</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let STATE = {}, RULES = [];

function toast(msg, bad){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.borderColor = bad ? 'var(--err)' : 'var(--line)';
  t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 3600);
}
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body){
  const r = await fetch(path, body===undefined ? {} : {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (r.status === 401) { location.href = '/login'; return {ok:false}; }
  return await r.json();
}

let LOGIN_MSG = '';
function setLoginMsg(m, ok){ LOGIN_MSG = m || ''; document.getElementById('loginMsg') && (function(el){
  el.textContent = LOGIN_MSG; el.style.color = ok ? 'var(--ok)' : 'var(--err)'; })(document.getElementById('loginMsg')); }

function renderState(){
  const st = STATE.state || {};
  const pill = document.getElementById('tgstate');
  if (st.authorized){ pill.className='pill ok'; pill.textContent='已登录 ' + (st.me?.name || ''); }
  else { pill.className='pill err'; pill.textContent='未登录'; }
  const box = document.getElementById('loginBox');
  if (st.authorized){
    box.innerHTML = `<div>✅ 已登录为 <b>${esc(st.me?.name||'')}</b>
      ${st.me?.username?('@'+esc(st.me.username)):''}（id ${esc(st.me?.id||'')}）</div>
      <div class="hint">会话已保存在本机，重启容器也不用重新登录。</div>
      <div class="bar"><button class="ghost" onclick="tgLogout()">退出 Telegram 登录</button></div>`;
    return;
  }
  box.innerHTML = `
    ${st.error ? `<div class="hint" style="color:var(--err)">⚠️ ${esc(st.error)}</div>` : ''}
    ${STATE.api_id_set === false ? '<div class="hint" style="color:var(--warn)">还没配置 Telegram API ID/Hash：在 compose 同目录的 .env 里加 TG_API_ID / TG_API_HASH（或编辑 data/config.json 的 tg 段），然后点下面的「发送验证码」即可生效，不用重启。</div>' : ''}
    <label>手机号（国际格式，要带 + 和国家码）</label>
    <input type="text" id="phone" placeholder="+8613800000000" value="${esc(STATE.phone||'')}">
    <div class="bar">
      <button id="sendBtn" onclick="sendCode()">发送验证码</button>
      <span class="hint">验证码会发到你现在的 Telegram 里</span>
    </div>
    <label>验证码</label>
    <input type="text" id="code" placeholder="例如 12345" inputmode="numeric">
    <label id="pwLabel" style="display:none">两步验证密码</label>
    <input type="password" id="pw" placeholder="账号开了两步验证才需要填" style="display:none">
    <div class="bar"><button id="verifyBtn" onclick="verify()">完成登录</button></div>
    <div id="loginMsg" class="hint" style="${LOGIN_MSG?'color:var(--err)':''}">${esc(LOGIN_MSG)}</div>`;
  const showPw = !!st.need_password;
  document.getElementById('pwLabel').style.display = showPw ? 'block' : 'none';
  document.getElementById('pw').style.display = showPw ? 'block' : 'none';
}

function ruleCard(r, i){
  const wl = (r.whitelist||[]).join('\n'), bl = (r.blacklist||[]).join('\n');
  return `<div class="rule" data-i="${i}">
    <div class="head">
      <span class="name">📨 ${esc(r.name||('规则'+(i+1)))}</span>
      <span class="switch"><input type="checkbox" class="f-enabled" ${r.enabled===false?'':'checked'}> 启用</span>
    </div>
    <label>名称（随便起，方便自己认）</label>
    <input type="text" class="f-name" value="${esc(r.name||'')}" placeholder="如：FC2">
    <div class="row">
      <div><label>来源频道 ID</label><input type="text" class="f-source" value="${esc(r.source||'')}" placeholder="-1001234567890"></div>
      <div><label>目标频道 ID</label><input type="text" class="f-target" value="${esc(r.target||'')}" placeholder="-1001234567890"></div>
    </div>
    <label>转发方式</label>
    <select class="f-mode">
      <option value="forward" ${(r.mode||'forward')==='forward'?'selected':''}>转发原消息（保留媒体/预览，推荐）</option>
      <option value="text" ${r.mode==='text'?'selected':''}>只发文本+链接（最轻量）</option>
    </select>
    <details>
      <summary>高级：正则黑白名单 / 媒体重传</summary>
      <label>白名单正则（每行一条；留空＝不过滤，全部转发）</label>
      <textarea class="f-wl" placeholder="(?-i)FC2 或 (?i)fc2|fc2-ppv">${esc(wl)}</textarea>
      <label>黑名单正则（每行一条；命中就跳过）</label>
      <textarea class="f-bl" placeholder="(?i)广告|预告">${esc(bl)}</textarea>
      <div class="switch" style="margin-top:8px"><input type="checkbox" class="f-media" ${r.media_fallback?'checked':''}> 转发原消息失败时，尝试下载并重新上传媒体（大文件较慢）</div>
      <div class="hint">匹配范围：消息正文 + 文件名（相册取整组文字/文件名）；**相册（多图/多视频+文字）会整组原样转发，不会被拆成散条**；默认忽略大小写，写 <code>(?-i)</code> 可强制区分大小写。</div>
    </details>
    <div class="bar">
      <button class="ghost" onclick="previewRule(${i})">预览会转什么</button>
      <button class="ghost" onclick="testRule(${i})">测试这条</button>
      <button class="danger" onclick="delRule(${i})">删除</button>
    </div>
    <div class="pv" id="pv${i}"></div>
  </div>`;
}

function renderRules(){
  document.getElementById('rules').innerHTML = RULES.map(ruleCard).join('') ||
    '<div class="hint">还没有规则，点下面「＋ 新增规则」。</div>';
}

function readRules(){
  return [...document.querySelectorAll('#rules .rule')].map((el, i) => ({
    id: (RULES[i]||{}).id,
    name: el.querySelector('.f-name').value.trim(),
    enabled: el.querySelector('.f-enabled').checked,
    source: el.querySelector('.f-source').value.trim(),
    target: el.querySelector('.f-target').value.trim(),
    mode: el.querySelector('.f-mode').value,
    media_fallback: el.querySelector('.f-media').checked,
    whitelist: el.querySelector('.f-wl').value.split('\n').map(s=>s.trim()).filter(Boolean),
    blacklist: el.querySelector('.f-bl').value.split('\n').map(s=>s.trim()).filter(Boolean),
  }));
}

function addRule(){ RULES = readRules(); RULES.push({enabled:true, mode:'forward', whitelist:[], blacklist:[]}); renderRules(); }

let DELETED = [];   // 显式要删掉的规则 id（只有点「删除」才会进来，避免把别处的规则冲掉）

async function delRule(i){
  if (!confirm('确定删除这条规则？')) return;
  const cur = readRules();
  const gone = cur[i] || {};
  RULES = cur;
  if (gone.id) DELETED.push(gone.id);
  RULES.splice(i,1); renderRules(); await saveRules();
}

async function saveRules(){
  const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent='保存中…';
  const res = await api('/api/rules', {rules: readRules(), deleted: DELETED});
  btn.disabled = false; btn.textContent='💾 保存并生效';
  if (res.ok){ DELETED = []; RULES = res.rules; renderRules(); toast('✅ ' + (res.message||'已保存，立即生效')); }
  else toast('❌ ' + (res.error||'保存失败'), true);
}

async function previewRule(i){
  const el = document.getElementById('pv' + i);
  if (!el) return;
  el.textContent = '读取中…';
  let res;
  try { res = await api('/api/rules/preview', {rule: readRules()[i], limit: 15}); }
  catch(e){ res = {ok:false, error:'请求失败：'+e}; }
  if (!res || !res.ok){ el.textContent = '❌ ' + ((res && res.error) || '读取失败'); return; }
  const rows = (res.items || []).map(it =>
    `${it.will_forward ? '✅ 会转' : '⏭️ 跳过'}　#${it.id}　${esc(it.type)}　${esc((it.text||'').slice(0,70))}${it.will_forward ? '' : '　（' + esc(it.why||'') + '）'}`
  ).join('\n');
  el.textContent = '📋 ' + (res.summary || '') + '\n' + rows;
}

async function testRule(i){
  const rule = readRules()[i];
  toast('测试中…');
  const res = await api('/api/rules/test', {rule});
  toast(res.ok ? '✅ ' + (res.message||'已转发一条') : '❌ ' + (res.error||'测试失败'), !res.ok);
  loadLogs();
}

async function sendCode(){
  const el = document.getElementById('phone');
  const phone = (el ? el.value : '').trim();
  if (!phone) { setLoginMsg('请先填手机号（国际格式，如 +8613800000000）'); return; }
  const btn = document.getElementById('sendBtn');
  if (btn){ btn.disabled = true; btn.textContent = '发送中…'; }
  setLoginMsg('正在发送验证码…', true);
  let res;
  try { res = await api('/api/tg/send_code', {phone}); }
  catch(e){ res = {ok:false, error:'请求失败：' + e}; }
  if (btn){ btn.disabled = false; btn.textContent = '发送验证码'; }
  if (res && res.ok){
    setLoginMsg('✅ ' + (res.message || '验证码已发送'), true);
    // 45 秒内禁止重复发送（重复发送会让旧验证码失效）
    let left = 45;
    const t = setInterval(()=>{
      const b = document.getElementById('sendBtn'); if (!b){ clearInterval(t); return; }
      b.disabled = true; b.textContent = `重新发送 (${left--})`;
      if (left < 0){ clearInterval(t); b.disabled = false; b.textContent = '发送验证码'; }
    }, 1000);
    const c = document.getElementById('code'); if (c) c.focus();
  } else {
    setLoginMsg('❌ ' + ((res && res.error) || '发送失败'));
  }
}
async function verify(){
  const code = (document.getElementById('code') || {}).value || '';
  const pwEl = document.getElementById('pw');
  if (!code.trim()) { setLoginMsg('请填验证码（Telegram 里最新收到的那条）'); return; }
  const btn = document.getElementById('verifyBtn');
  if (btn){ btn.disabled = true; btn.textContent = '登录中…'; }
  setLoginMsg('正在登录…', true);
  let res;
  try { res = await api('/api/tg/verify', {code: code.trim(), password: pwEl ? pwEl.value.trim() : ''}); }
  catch(e){ res = {ok:false, error:'请求失败：' + e}; }
  if (btn){ btn.disabled = false; btn.textContent = '完成登录'; }
  if (res && res.ok && !res.need_password){
    setLoginMsg('✅ 登录成功', true);
    toast('✅ 登录成功', false);
    refresh();
    return;
  }
  setLoginMsg('❌ ' + ((res && res.error) || '登录失败'));
  toast('❌ ' + ((res && res.error) || '登录失败'), true);
  if (res && res.need_password) refresh();
}
async function tgLogout(){
  if (!confirm('退出 Telegram 登录？（转发会停，会话失效，下次要重新用手机号+验证码登录）')) return;
  await api('/api/tg/logout', {}); refresh();
}

/* ---------------- ④ 面板设置：改密码 / 恢复码 / 退出面板 ---------------- */
const val = id => ((document.getElementById(id)||{}).value || '').trim();
const fill = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };

function setMsg(m, ok){
  const el = document.getElementById('setMsg'); if (!el) return;
  el.textContent = m || '';
  el.style.color = m ? (ok === false ? 'var(--err)' : 'var(--ok)') : 'var(--dim)';
}

function showCode(code){
  const box = document.getElementById('codeBox');
  const v = document.getElementById('codeVal');
  if (!box || !v) return;
  if (!code){ box.style.display = 'none'; v.value = ''; return; }
  v.value = code; box.style.display = 'block';
}

async function copyCode(){
  const v = document.getElementById('codeVal'); if (!v || !v.value) return;
  v.removeAttribute('readonly'); v.focus(); v.select(); v.setSelectionRange(0, v.value.length);
  try { await navigator.clipboard.writeText(v.value); setMsg('✅ 恢复码已复制到剪贴板', true); }
  catch(e){
    try { document.execCommand('copy'); setMsg('✅ 恢复码已复制到剪贴板', true); }
    catch(e2){ setMsg('复制失败：请手动长按/拖选上面的恢复码复制', false); }
  }
  v.setAttribute('readonly','readonly');
}

async function savePanelPassword(){
  const cur = val('curPw'), p1 = val('newPw'), p2 = val('newPw2');
  if (!cur){ setMsg('请先填「当前密码」', false); return; }
  if (!p1){ setMsg('请填新密码', false); return; }
  if (p1 !== p2){ setMsg('两次输入的新密码不一样', false); return; }
  const btn = document.getElementById('pwBtn');
  btn.disabled = true; btn.textContent = '修改中…';
  setMsg('正在修改…', true);
  let res;
  try { res = await api('/api/web/password', {current: cur, new_password: p1, new_password2: p2}); }
  catch(e){ res = {ok:false, error:'请求失败：' + e}; }
  btn.disabled = false; btn.textContent = '修改面板密码';
  if (res && res.ok){
    setMsg('✅ ' + (res.message || '密码已修改') + '　' + (res.note || ''), true);
    showCode(res.recovery_code);
    fill('curPw',''); fill('newPw',''); fill('newPw2','');
    toast('✅ 面板密码已修改，立即生效', false);
    loadPanelInfo();
  } else {
    setMsg('❌ ' + ((res && res.error) || '修改失败'), false);
  }
}

async function regenRecovery(){
  const cur = val('curPw');
  if (!cur){ setMsg('请先在上面的「当前密码」里填现在的面板密码', false); return; }
  if (!confirm('重新生成恢复码？旧的恢复码立即作废。')) return;
  setMsg('正在生成…', true);
  let res;
  try { res = await api('/api/web/recovery', {current: cur}); }
  catch(e){ res = {ok:false, error:'请求失败：' + e}; }
  if (res && res.ok){
    setMsg('✅ ' + (res.message || '已生成新的恢复码') + '　' + (res.note || ''), true);
    showCode(res.recovery_code);
    loadPanelInfo();
  } else {
    setMsg('❌ ' + ((res && res.error) || '生成失败'), false);
  }
}

async function panelLogout(){
  if (!confirm('退出面板登录？（不影响 Telegram 登录和转发规则，下次用面板密码再进）')) return;
  try { await api('/api/web/logout', {}); } catch(e){}
  location.href = '/logout';
}

function loadPanelInfo(){
  const p = STATE.panel || {};
  const el = document.getElementById('recState'); if (!el) return;
  el.innerHTML = (p.recovery_set
      ? '✅ 已设置恢复码（忘记密码时可在登录页自助重置）'
      : '⚠️ 还没设置恢复码：填「当前密码」后点下面的「重新生成恢复码」，或先改一次密码（会自动生成）')
    + (p.pw_changed_at ? '　｜ 上次修改密码：' + esc(p.pw_changed_at) : '')
    + (p.reset_script ? '<br>兜底办法（没有恢复码时）：在本机运行 ' + esc(p.reset_script) + ' ，它会把密码重置成随机新密码并打印出来。' : '');
}

/* ---------------- ③ 最近记录：实时推送（SSE，服务端一有新记录立刻推）---------------- */
let LOGS = [], SSE_OPEN = false, SSE_FAILS = 0, LOG_COUNT = 0, LOG_KEEP = 0;

function renderLogs(){
  const el = document.getElementById('logs');
  if (el) el.textContent = LOGS.join('\n') || '（暂无记录）';
  const st = document.getElementById('logState');
  if (st){
    st.textContent = (SSE_OPEN ? '实时 ●' : '连接断开，正在重连…')
      + ' · ' + LOG_COUNT + ' 条' + (LOG_KEEP ? ' / 上限 ' + LOG_KEEP : ' / 不限');
    st.style.color = SSE_OPEN ? 'var(--ok)' : 'var(--err)';
  }
  const rb = document.getElementById('logRefresh');       // 只在断线时给「刷新」
  if (rb) rb.style.display = SSE_OPEN ? 'none' : 'inline-block';
  const sel = document.getElementById('logKeep');
  if (sel && String(sel.value) !== String(LOG_KEEP)){
    if (![...sel.options].some(o => o.value === String(LOG_KEEP))){
      const o = document.createElement('option');
      o.value = String(LOG_KEEP); o.textContent = LOG_KEEP + ' 条'; sel.appendChild(o);
    }
    sel.value = String(LOG_KEEP);
  }
}

function applyLogMeta(d){
  if (!d) return;
  if (typeof d.count === 'number') LOG_COUNT = d.count;
  if (typeof d.keep === 'number') LOG_KEEP = d.keep;
}

async function loadLogs(manual){
  const res = await api('/api/logs');
  if (res && res.ok){
    LOGS = res.logs || []; applyLogMeta(res); renderLogs();
    if (manual) toast('已刷新');
  }
}

async function clearLogs(){
  if (!confirm('清空最近记录？（只是清掉这个列表，不影响转发和规则）')) return;
  let res;
  try { res = await api('/api/logs/clear', {}); } catch(e){ res = {ok:false, error:'请求失败：'+e}; }
  if (res && res.ok){
    LOGS = []; LOG_COUNT = 0; renderLogs();
    toast('✅ ' + (res.message || '已清空记录'));
  } else {
    toast('❌ ' + ((res && res.error) || '清空失败'), true);
  }
}

async function setLogKeep(v){
  let res;
  try { res = await api('/api/logs/limit', {limit: Number(v)}); }
  catch(e){ res = {ok:false, error:'请求失败：'+e}; }
  if (res && res.ok){
    LOG_KEEP = Number(res.keep);
    if (typeof res.count === 'number') LOG_COUNT = res.count;
    renderLogs();
    toast('✅ ' + (res.message || '已设置'));
  } else {
    toast('❌ ' + ((res && res.error) || '设置失败'), true);
    api('/api/state').then(r => { if (r && r.ok) refresh(); });
  }
}

function startLogStream(){
  if (!window.EventSource){          // 老浏览器兜底：退回定时刷新
    loadLogs();
    setInterval(loadLogs, 10000);
    return;
  }
  const es = new EventSource('/api/logs/stream');
  es.addEventListener('init', ev => {           // 连上 / 服务端清空或自动清理后：整份覆盖
    SSE_OPEN = true; SSE_FAILS = 0;
    try {
      const d = JSON.parse(ev.data);
      LOGS = d.lines || []; applyLogMeta(d);
    } catch(e){}
    renderLogs();
  });
  es.addEventListener('line', ev => {
    SSE_OPEN = true; SSE_FAILS = 0;
    try {
      const d = JSON.parse(ev.data);
      if (d.line) LOGS.unshift(d.line);
      applyLogMeta(d);
    } catch(e){}
    if (LOGS.length > 500) LOGS.length = 500;
    renderLogs();
  });
  es.onerror = () => {                // EventSource 会自己重连，这里只更新状态
    SSE_OPEN = false; renderLogs();
    if (++SSE_FAILS >= 3){ SSE_FAILS = 0; api('/api/state'); }   // 会话失效时会被踢回登录页
  };
}

async function refresh(){
  const res = await api('/api/state');
  if (!res.ok) return;
  STATE = res; RULES = res.rules || [];
  renderState(); renderRules(); loadPanelInfo();
}
refresh(); startLogStream();
</script>
