name: Build and push image (Docker Hub)

# 推送到 main 分支或打 v* 标签时：构建多架构镜像（amd64 + arm64）并推到 Docker Hub。
#
# 首次使用前，在仓库 Settings → Secrets and variables → Actions 里加两个密钥：
#   DOCKERHUB_USERNAME  = 你的 Docker Hub 用户名
#   DOCKERHUB_TOKEN     = Docker Hub 的 Access Token（Account Settings → Security → New Access Token）
# 没配这两个密钥时，本工作流只构建不推送（不会报红）。

on:
  push:
    branches: [main]
    tags: ['v*']
    # 纯文档改动（README/LICENSE 等）不触发构建，省 CI 时间、也避免 mirror 出无意义的新镜像
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 打 tag 时创建 GitHub Release 需要写权限（构建/推送镜像本身不需要）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub 凭据是否已配置
        id: dh
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
            echo "image=${{ secrets.DOCKERHUB_USERNAME }}/tg-forwarder" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "image=tg-forwarder" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次只构建、不推送镜像"
          fi

      - name: Set up QEMU（多架构必需）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.dh.outputs.ok == 'yes' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dh.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
          # 只打两个 tag：版本号（如 1.0.0）+ latest（跟主分支最新）
          # 不打分支名 tag（main）也不打次版本别名（1.0），避免同一镜像出现多个重复 tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.dh.outputs.ok == 'yes' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 推送 v* tag 时自动建一个 GitHub Release（正文按 commit 自动生成；同 tag 重跑会更新而不是报错）。
      # 注意：这一步只在 tag 上跑，推 main 不会创建 Release。
      - name: 打 tag 时创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
